<header class="topbar">
    <div class="topbar__left">
        <div class="topbar__logo">
            <i class="bi bi-crown-fill"></i>
        </div>

        <div class="topbar__meeting">
            <span class="topbar__time-badge">{{ currentTime }}</span>
            <div class="topbar__meeting-info">
                <span class="topbar__meeting-label">
                    <span class="topbar__dot"></span>
                    Next Meeting
                </span>
                <span class="topbar__meeting-title">{{ meetingTitle }}</span>
            </div>
        </div>
    </div>

    <div class="topbar__right">
        <button type="button" class="btn btn-primary topbar__create-btn">
            <i class="bi bi-plus-lg"></i>
            <span>Create</span>
        </button>

        <button type="button" class="topbar__icon-btn" aria-label="Search">
            <i class="bi bi-search"></i>
        </button>

        <button type="button" class="topbar__icon-btn" aria-label="Send">
            <i class="bi bi-send"></i>
        </button>

        <button type="button" class="topbar__icon-btn topbar__icon-btn--notif" aria-label="Notifications">
            <i class="bi bi-bell"></i>
            <span class="topbar__badge" *ngIf="notificationCount > 0">{{ notificationCount }}</span>
        </button>

        <button type="button" class="topbar__icon-btn" aria-label="Messages">
            <i class="bi bi-envelope"></i>
        </button>

        <div class="topbar__timezone">
            <span>{{ timezone }}</span>
            <i class="bi bi-chevron-down"></i>
        </div>

        <img class="topbar__avatar" [src]="avatarUrl" alt="User avatar" />
    </div>
</header>
