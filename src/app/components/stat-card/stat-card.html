<div class="stat-card">
  <div class="stat-card__header">
    <span class="stat-card__label">{{ label }}</span>
    <span class="stat-card__icon">
      <i class="bi" [ngClass]="icon"></i>
    </span>
  </div>

  <div class="stat-card__value">{{ value }}</div>

  <div class="stat-card__unit">{{ unit }}</div>
</div>
